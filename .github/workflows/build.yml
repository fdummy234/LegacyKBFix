name: Build

# Déclenchement MANUEL uniquement : aucun commit ne lance de build.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la release (vide = build-<numéro>)"
        required: false
        default: ""

permissions:
  contents: write        # nécessaire pour créer la release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        uses: Randomblock1/theos-action@v1

      - name: Build package
        run: make clean && make package FINALPACKAGE=1

      - name: Inspect .deb
        continue-on-error: true
        run: |
          DEB=$(ls packages/*.deb | head -n1)
          echo "===== CONTENU ====="
          dpkg-deb -c "$DEB"
          echo "===== CONTROL ====="
          dpkg-deb -I "$DEB"

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="build-${{ github.run_number }}"; fi
          echo "Tag : $TAG"
          gh release create "$TAG" packages/*.deb \
            --draft \
            --title "LegacyKBFix $TAG" \
            --notes "Build manuel — commit ${{ github.sha }}"
